[workspace]
members = ["core", "orchestration", "cli"]
resolver = "3"

[workspace.dependencies]
async-trait = "0.1.89"
arrow = "58.2.0"
axum = "0.7"
datafusion = "53.1.0"
indoc = "2.0.7"
object_store = { version = "0.13.2", features = ["http"] }
parquet = { version = "58.2.0", features = ["arrow"] }
reqwest = "0.13.3"
scraper = "0.26.0"
serde = { version = "1.0.228", features = ["derive", "serde_derive"] }
serde_yaml = "0.9.34"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["full"] }
tower-http = { version = "0.6.10", features = ["fs"] }
url = "2.5.8"
